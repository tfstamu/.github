name: Website Uptime Monitor
on:
  schedule:
    - cron: '0 8 * * 1-5'  # Runs every day at 8:00 UTC. Adjust schedule or remove entirely if you don't need it
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # cancel the job if it runs over 20 minutes

    steps:
      - uses: actions/checkout@v7

      - name: Monitor websites
        uses: cd-roman/uptime-monitor@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sites: |
            https://experience.arcgis.com/experience/e57b876c8cd542b6b35ca864dcaccaa6/page/How-Do-Trees-Reduce-LST%3F?draft=true#data_s=id%3AdataSource_3-1925906c0c5-layer-11-19a560056f0-layer-13%3A1
            https://texasforestinfo.tamu.edu/utc/
          timezone: "UTC"